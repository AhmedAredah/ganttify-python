[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ganttify-python"
version = "0.1.1"
description = "Interactive WBS Gantt charts with planned and actual schedules, powered by Plotly"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmed Aredah", email = "Ahmed.Aredah@gmail.com" }]
keywords = ["gantt", "wbs", "plotly", "project-management", "schedule"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["plotly>=6,<8"]

[project.optional-dependencies]
dataframe = ["pandas>=2.2"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/AhmedAredah/ganttify-python"
Documentation = "https://github.com/AhmedAredah/ganttify-python/tree/main/docs"
Repository = "https://github.com/AhmedAredah/ganttify-python"
Issues = "https://github.com/AhmedAredah/ganttify-python/issues"
Changelog = "https://github.com/AhmedAredah/ganttify-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ganttify = ["py.typed", "assets/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "IPython", "IPython.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ganttify"]

[tool.coverage.report]
show_missing = true
skip_covered = true
