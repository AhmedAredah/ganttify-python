name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,dataframe]"
      - run: python -m pytest --cov=ganttify --cov-report=term-missing --cov-report=xml
      - run: python examples/basic.py
      - run: python examples/advanced.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: node --test tests/test_runtime.mjs

  browser:
    runs-on: ubuntu-latest
    env:
      GANTTIFY_TEST_INSTALLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
      - run: node tests/browser_regressions.cjs

  minimum-plotly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]" "plotly==6.0.0"
      - run: python -m pytest

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and exercise export outside checkout
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary)
              environment = root / 'venv'
              venv.create(environment, with_pip=True)
              python = environment / 'bin' / 'python'
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
              script = '''
          from datetime import date
          from importlib.resources import files
          from ganttify import ganttify
          from ganttify.datasets import get_test_project

          project = get_test_project()
          chart = ganttify(project['wbs_structure'], project['activities'], as_of=date(2025, 1, 1))
          html = chart.to_html()
          assert 'Plotly' in html and 'plotly_relayout' in html
          assert files('ganttify').joinpath('assets/runtime.js').is_file()
          chart.write_html('wheel-smoke.html')
          print('Installed wheel export succeeded')
          '''
              subprocess.run([str(python), '-I', '-c', script], cwd=root, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
